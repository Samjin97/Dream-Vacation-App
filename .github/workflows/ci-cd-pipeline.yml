name: CI/CD Pipeline

on:
  push:
    branches: [ devops ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  pull_request:
    branches: [ devops ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  # ---------------- FRONTEND ----------------
  frontend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dva-frontend
    steps:
      - uses: actions/checkout@v3

      - name: Lint frontend
        uses: github/super-linter@v6
        env:
          DEFAULT_BRANCH: devops
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true

      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/dva-frontend:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/dva-frontend:latest

  # ---------------- BACKEND ----------------
  backend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dva-backend
    steps:
      - uses: actions/checkout@v3

      - name: Lint backend
        uses: github/super-linter@v6
        env:
          DEFAULT_BRANCH: devops
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true

      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/dva-backend:${{ env.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/dva-backend:latest

  # ---------------- TERRAFORM ----------------
  terraform:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    outputs:
      ec2_ip: ${{ steps.get_outputs.outputs.ec2_ip }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -no-color
     
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -no-color

      - name: Get Terraform outputs
        id: get_outputs
        working-directory: terraform
        run: |
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

  # ---------------- DEPLOY ----------------
  deploy:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v3

      # Setup SSH key
      - name: Setup SSH key
        run: |  
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/dream-key
          chmod 600 ~/.ssh/dream-key

      # Wait for EC2 SSH
      - name: Wait for EC2 SSH
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -i ~/.ssh/dream-key ubuntu@${{ needs.terraform.outputs.ec2_ip }} "echo '✅ SSH ready'"; then
              echo "EC2 is ready"
              break
            fi
            sleep 10
          done

      # Copy project files
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./*"
          target: "~/dream-vacation-app"

      # Deploy containers
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/dream-vacation-app
            cat > .env <<EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOF
            docker-compose pull
            docker-compose up -d --remove-orphans
